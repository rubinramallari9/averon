name: IndexNow

# After Vercel finishes a production deploy, tell Bing & co. to re-crawl
# every page in the sitemap (see averon-nextjs/scripts/indexnow.mjs).
on:
  deployment_status:

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Submit sitemap URLs to IndexNow
        run: node averon-nextjs/scripts/indexnow.mjs
